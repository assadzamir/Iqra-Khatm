name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node version comes from .nvmrc (20.19.4) — newer majors fail
      # dependency engine checks (see README).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      # yarn test runs --watchAll and never exits; CI must invoke jest directly.
      - name: Tests
        run: npx jest --ci
